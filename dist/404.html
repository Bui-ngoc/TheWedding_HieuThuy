<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Thiệp Cưới Online | Thu Thủy & Trần Hiếu - 18.10.2026</title>
    
    <!-- Automatic GitHub Pages SPA short link redirection script -->
    <script>
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var pathSegments = pathname.split('/').filter(Boolean);

        var ignored = [
          'thewedding_hieuthuy',
          'thewedding-hieuthuy',
          'thiepcuoi_hieuthuy',
          'thiepcuoi-hieuthuy',
          'index.html',
          '404.html',
          'assets',
          'images',
          'audio',
          'api',
          'favicon.ico',
          'src',
          '.netlify',
          'admin',
          'gh-pages'
        ];

        var guestSegment = pathSegments.find(function(seg) {
          return ignored.indexOf(seg.toLowerCase()) === -1 && seg.indexOf('.') === -1;
        });

        var repoPrefix = pathSegments.length > 0 && ignored.indexOf(pathSegments[0].toLowerCase()) !== -1
          ? '/' + pathSegments[0]
          : '';

        if (guestSegment) {
          var extraSearch = l.search ? '&' + l.search.substring(1) : '';
          var targetUrl = l.protocol + '//' + l.host + repoPrefix + '/?to=' + encodeURIComponent(guestSegment) + extraSearch + l.hash;
          l.replace(targetUrl);
        } else {
          var homeUrl = l.protocol + '//' + l.host + repoPrefix + '/' + l.search + l.hash;
          l.replace(homeUrl);
        }
      })();
    </script>
  </head>
  <body>
  </body>
</html>
